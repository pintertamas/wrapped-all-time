name: CI/CD

# Factory CI/CD: changes -> Code Quality & Tests -> deploys on main. Keep the job names and the
# deploy rules. Level 0 product: static frontend only, no backend, no cloud resources (re-add only
# through a later gate:cloud).
# Runners are pinned; move to a newer image deliberately, after verifying the build still passes.
# VITE_* values are public build-time config (GitHub Environment/repo variables, never secrets);
# an unset variable arrives empty and the committed default in frontend/.env applies.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Cloudflare Pages project of the production site (<name>.pages.dev). Public, not a secret.
  CF_PAGES_PROJECT: listening-vault

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - frontend/**
              - .github/workflows/ci-cd.yaml

  test:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Unit tests run on the committed .env defaults only (no VITE_* overrides).
      - name: Unit tests
        run: npm test

      - name: Build (typecheck + vite build)
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_CANONICAL_URL: ${{ vars.VITE_CANONICAL_URL }}
          VITE_ROBOTS: ${{ vars.VITE_ROBOTS }}
          VITE_ENV_LABEL: ${{ vars.VITE_ENV_LABEL }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_UNLOCK_PROVIDER: ${{ vars.VITE_UNLOCK_PROVIDER }}
          VITE_UNLOCK_PRODUCT_ID: ${{ vars.VITE_UNLOCK_PRODUCT_ID }}
          VITE_UNLOCK_STORE_ID: ${{ vars.VITE_UNLOCK_STORE_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_SITE: ${{ vars.VITE_ANALYTICS_SITE }}
          VITE_FEATURE_LOGIN: ${{ vars.VITE_FEATURE_LOGIN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build

      - name: Size budgets
        run: npm run size

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright against vite preview)
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_CANONICAL_URL: ${{ vars.VITE_CANONICAL_URL }}
          VITE_ROBOTS: ${{ vars.VITE_ROBOTS }}
          VITE_ENV_LABEL: ${{ vars.VITE_ENV_LABEL }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_UNLOCK_PROVIDER: ${{ vars.VITE_UNLOCK_PROVIDER }}
          VITE_UNLOCK_PRODUCT_ID: ${{ vars.VITE_UNLOCK_PRODUCT_ID }}
          VITE_UNLOCK_STORE_ID: ${{ vars.VITE_UNLOCK_STORE_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_SITE: ${{ vars.VITE_ANALYTICS_SITE }}
          VITE_FEATURE_LOGIN: ${{ vars.VITE_FEATURE_LOGIN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-24.04
    needs:
      - test
      - changes
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.frontend == 'true')
    # Staging (test mode). Environment variables of `github-pages` override repo variables.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Staging is never indexed and says so; its canonical points at the production site.
          VITE_ROBOTS: noindex
          VITE_ENV_LABEL: TEST SITE
          VITE_CANONICAL_URL: https://${{ env.CF_PAGES_PROJECT }}.pages.dev/
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_UNLOCK_PROVIDER: ${{ vars.VITE_UNLOCK_PROVIDER }}
          VITE_UNLOCK_PRODUCT_ID: ${{ vars.VITE_UNLOCK_PRODUCT_ID }}
          VITE_UNLOCK_STORE_ID: ${{ vars.VITE_UNLOCK_STORE_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_SITE: ${{ vars.VITE_ANALYTICS_SITE }}
          VITE_FEATURE_LOGIN: ${{ vars.VITE_FEATURE_LOGIN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          include-hidden-files: "true"   # keep frontend/public/.nojekyll

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-frontend-cloudflare:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-24.04
    needs:
      - test
      - changes
    # Same triggers as the staging deploy; skipped until the owner sets the repo variable
    # CLOUDFLARE_ACCOUNT_ID (a public id, not a secret).
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.frontend == 'true'))
    # Production (live provider values). Environment variables of `production` override repo variables.
    environment:
      name: production
      url: https://${{ env.CF_PAGES_PROJECT }}.pages.dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Served from the root of <project>.pages.dev; build emits dist/_headers and dist/robots.txt.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_SITE_URL: https://${{ env.CF_PAGES_PROJECT }}.pages.dev/
          VITE_CANONICAL_URL: https://${{ env.CF_PAGES_PROJECT }}.pages.dev/
          VITE_ROBOTS: ${{ vars.VITE_ROBOTS }}
          VITE_ENV_LABEL: ""
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_UNLOCK_PROVIDER: ${{ vars.VITE_UNLOCK_PROVIDER }}
          VITE_UNLOCK_PRODUCT_ID: ${{ vars.VITE_UNLOCK_PRODUCT_ID }}
          VITE_UNLOCK_STORE_ID: ${{ vars.VITE_UNLOCK_STORE_ID }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_SITE: ${{ vars.VITE_ANALYTICS_SITE }}
          VITE_FEATURE_LOGIN: ${{ vars.VITE_FEATURE_LOGIN }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      # The API token is passed to this step only and is never printed (no `set -x`, no echo).
      - name: Create Pages project if missing and deploy
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}")
          if [ "$status" = "404" ]; then
            npx --yes wrangler@4.150.0 pages project create "${CF_PAGES_PROJECT}" --production-branch main
          elif [ "$status" != "200" ]; then
            echo "Cloudflare project lookup failed with HTTP ${status}" >&2
            exit 1
          fi
          npx --yes wrangler@4.150.0 pages deploy dist \
            --project-name "${CF_PAGES_PROJECT}" --branch main --commit-dirty=true
